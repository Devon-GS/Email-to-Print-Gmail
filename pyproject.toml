[project]
name = "email-to-print-gmail"
version = "0.1.0"
description = "Print from gmail automatically"
authors = [
    {name = "Devon",email = "ds.pydev@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10, <=3.16"
dependencies = [
    "google-api-python-client (>=2.202.0,<3.0.0)",
    "google-auth-oauthlib (>=1.5.0,<2.0.0)",
    "google-auth (>=2.62.2,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
